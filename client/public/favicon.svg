<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="tb-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1310" />
      <stop offset="100%" stop-color="#142B20" />
    </linearGradient>
    <linearGradient id="sun-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA43A" />
      <stop offset="100%" stop-color="#F25C05" />
    </linearGradient>
  </defs>

  <!-- Background rounded badge -->
  <rect width="64" height="64" rx="14" fill="url(#tb-grad)" stroke="#20382E" stroke-width="1.5" />

  <!-- Rising Sun -->
  <circle cx="32" cy="27" r="13" fill="url(#sun-grad)" />

  <!-- Background Mountain Peak -->
  <polygon points="12,50 32,19 52,50" fill="#182A23" />
  <!-- Snow / Highlight on Peak -->
  <polygon points="32,19 26,29 32,27 38,29" fill="#F2F7F4" opacity="0.9" />

  <!-- Foreground Mountain Peak -->
  <polygon points="20,52 41,25 58,52" fill="#20382E" />
  <polygon points="41,25 36,33 41,31 46,33" fill="#F2F7F4" opacity="0.85" />

  <!-- Alpine Pine Tree -->
  <polygon points="17,49 20,44 18.5,44 21,39 19.5,39 21.5,34 23.5,39 22,39 24.5,44 23,44 26,49" fill="#4D7C33" />
  <polygon points="26,51 28,46 27,46 29,42 28,42 29.5,38 31,42 30,42 32,46 31,46 33,51" fill="#5D943E" />

  <!-- TrekBest Orange Ground Sweep -->
  <path d="M4 52 Q 32 46 60 52 L 60 60 Q 32 60 4 60 Z" fill="#F25C05" opacity="0.9" />
</svg>